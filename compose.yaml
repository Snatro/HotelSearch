services:
postgres:
image: postgres:17-alpine
container_name: hotelsearch-postgres
environment:
POSTGRES_DB: HotelSearchDb
POSTGRES_USER: postgres
POSTGRES_PASSWORD: localdevpassword
ports:
- "5432:5432"
volumes:
- hotelsearch-data:/var/lib/postgresql/data
healthcheck:
test: ["CMD-SHELL", "pg_isready -U postgres -d HotelSearchDb"]
interval: 5s
timeout: 5s
retries: 10

volumes:
hotelsearch-data: